name = "theo-uptime"
main = "src/index.js"
compatibility_date = "2026-11-19"

[triggers]
# Every 5 minutes for the two Cloudflare sites, hourly for Hulog.
crons = ["*/5 * * * *", "0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "uptime"
# Not a secret: using it still needs a login to this Cloudflare account.
database_id = "a325c3f6-8c35-443b-b559-4e55e326828f"

name = "theo-uptime"
main = "src/index.js"
compatibility_date = "2026-11-19"

# Serve only on my own domain. Cloudflare creates the DNS record and the
# certificate. workers.dev is off because that URL carries the account's
# subdomain, which is built from my email address.
routes = [{ pattern = "status.theoith.ink", custom_domain = true }]
workers_dev = false
preview_urls = false

[triggers]
# Every 5 minutes for the two Cloudflare sites. Hulog has no cron here: it is
# probed from .github/workflows/probe-hulog.yml, which posts to /ingest.
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "uptime"
# Not a secret: using it still needs a login to this Cloudflare account.
database_id = "a325c3f6-8c35-443b-b559-4e55e326828f"
